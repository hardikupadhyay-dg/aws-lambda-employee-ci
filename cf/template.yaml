AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DataGrokr assignment - Emp_Master DynamoDB, Lambda, and HTTP API

Resources:
  EmpMasterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Emp_Master
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Emp_Id
          AttributeType: S
      KeySchema:
        - AttributeName: Emp_Id
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EmpMasterLambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: LambdaDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmpMasterTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

  EmployeeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: EmployeeApiFunction
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          dynamodb = boto3.resource('dynamodb')
          TABLE_NAME = os.environ.get('TABLE_NAME', 'Emp_Master')
          table = dynamodb.Table(TABLE_NAME)

          def build_response(status_code, body_dict):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type": "application/json"
                  },
                  "body": json.dumps(body_dict)
              }

          def handle_post(event):
              body = event.get("body")
              if isinstance(body, str):
                  body = json.loads(body or "{}")

              required_fields = ["Emp_Id", "First_Name", "Last_Name", "Date_Of_Joining"]
              missing = [f for f in required_fields if f not in body]
              if missing:
                  return build_response(
                      400,
                      {"error": f"Missing fields: {', '.join(missing)}"}
                  )

              item = {
                  "Emp_Id": body["Emp_Id"],
                  "First_Name": body["First_Name"],
                  "Last_Name": body["Last_Name"],
                  "Date_Of_Joining": body["Date_Of_Joining"],
              }

              table.put_item(Item=item)
              print(f"Inserted item: {item}")
              return build_response(201, {"message": "Employee created", "item": item})

          def handle_get(event):
              # HTTP API v2: queryStringParameters
              query_params = event.get("queryStringParameters") or {}
              emp_id = query_params.get("emp_id")

              if not emp_id:
                  return build_response(
                      400,
                      {"error": "emp_id query parameter is required"}
                  )

              resp = table.get_item(Key={"Emp_Id": emp_id})
              item = resp.get("Item")
              print(f"Fetched item for Emp_Id={emp_id}: {item}")

              if not item:
                  return build_response(404, {"error": "Employee not found"})

              return build_response(200, {"item": item})

          def lambda_handler(event, context):
              # Allow local testing by passing method manually
              method = None

              # HTTP API v2
              if "requestContext" in event and "http" in event["requestContext"]:
                  method = event["requestContext"]["http"]["method"]
              # REST API (proxy)
              elif "httpMethod" in event:
                  method = event["httpMethod"]
              # Local test event
              else:
                  method = event.get("method", "GET")

              if method == "POST":
                  return handle_post(event)
              elif method == "GET":
                  return handle_get(event)
              else:
                  return build_response(
                      405,
                      {"error": f"Method {method} not allowed"}
                  )

      Environment:
        Variables:
          TABLE_NAME: Emp_Master

  EmployeeHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: EmployeeHttpApi
      ProtocolType: HTTP

  EmployeeLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref EmployeeHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EmployeeLambdaFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  EmployeePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref EmployeeHttpApi
      RouteKey: POST /employee
      Target: !Sub integrations/${EmployeeLambdaIntegration}

  EmployeeGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref EmployeeHttpApi
      RouteKey: GET /employee
      Target: !Sub integrations/${EmployeeLambdaIntegration}

  EmployeeApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref EmployeeHttpApi
      StageName: prod
      AutoDeploy: true

  EmployeeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmployeeLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmployeeHttpApi}/*/*/employee

Outputs:
  ApiInvokeUrl:
    Description: Base URL for the Employee HTTP API
    Value: !Sub https://${EmployeeHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/employee

  DynamoTableName:
    Description: DynamoDB table name
    Value: !Ref EmpMasterTable

  LambdaFunctionArn:
    Description: Employee Lambda ARN
    Value: !GetAtt EmployeeLambdaFunction.Arn
